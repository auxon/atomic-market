name = "atomic-market"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Custom domain path (workers.dev keeps serving /v1/* at the root).
# The exact route catches the bare path so the worker can 308 it.
# market.entangleit.com is the BRC-100 app origin (UI + manifest).
routes = [
  { pattern = "entangleit.com/atomic-market", zone_name = "entangleit.com" },
  { pattern = "entangleit.com/atomic-market/*", zone_name = "entangleit.com" },
  { pattern = "market.entangleit.com", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "atomic-market"
database_id = "19b91f85-4782-4fe0-8cf6-17bac2b480e2"
migrations_dir = "."
